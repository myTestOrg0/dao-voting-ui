name: Native Python PR Socket

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: native-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: >-
      github.event_name != 'pull_request' ||
      (github.base_ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SOCKET_REPO: ${{ github.event.repository.name }}
      SCAN_BRANCH: ${{ github.head_ref || github.ref_name }}
      SCAN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout PR snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SCAN_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hash-pinned Python CLI
        run: |
          echo 'b4e741886bd223db7a91ac7c41a2a09137aafd9018a8fd318df4b6858e9225cc  .github/tools/socket-python-cli.lock' | sha256sum --check
          python -m pip install --require-hashes --only-binary=:all: -r .github/tools/socket-python-cli.lock
          socketcli --version
      - name: Create empty control baseline for full snapshot comparison
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/socket-python" "$RUNNER_TEMP/socket-python-empty"
          printf '{"name":"socket-poc-empty-control","version":"1.0.0","private":true}\n' > "$RUNNER_TEMP/socket-python-empty/package.json"
          socketcli --scm api --repo "$SOCKET_REPO" --branch "native-python-control-$GITHUB_RUN_ID" \
            --target-path "$RUNNER_TEMP/socket-python-empty" --pr-number 0 \
            --json-file "$RUNNER_TEMP/socket-python/baseline.json"
          baseline=$(jq -er .full_scan_id "$RUNNER_TEMP/socket-python/baseline.json")
          echo "SOCKET_PYTHON_BASE_SCAN_ID=$baseline" >> "$GITHUB_ENV"
      - name: Native Python scan and PR comment, with comment suppression disabled
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(GH_TOKEN="$GH_API_TOKEN" gh pr view "$SCAN_BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq .number)
          fi
          socketcli --scm github --repo "$SOCKET_REPO" --owner "$GITHUB_REPOSITORY_OWNER" \
            --target-path . --branch "$SCAN_BRANCH" --commit-sha "$SCAN_COMMIT" --pr-number "$PR_NUMBER" \
            --base-scan-id "$SOCKET_PYTHON_BASE_SCAN_ID" --ignore-commit-files --strict-blocking \
            --disable-ignore --disable-overview \
            --json-file "$RUNNER_TEMP/socket-python/report.json" \
            --summary-file "$RUNNER_TEMP/socket-python/summary.txt" \
            --report-link-file "$RUNNER_TEMP/socket-python/report-link.txt"
      - name: Publish native Summary
        if: always()
        run: |
          echo '## Socket native Python' >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/socket-python/summary.txt" ]; then
            cat "$RUNNER_TEMP/socket-python/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No completed CLI assessment. See the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload native Python results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-python-pr-socket
          path: ${{ runner.temp }}/socket-python/*
          retention-days: 7
