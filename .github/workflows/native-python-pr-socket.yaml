# Socket dependency scan for pull requests, selected from an organization ruleset.
#
# What it does: scans every dependency manifest at the PR head (the whole branch,
# not only the lines the PR changed), lists every Warn/Block finding in one PR
# comment, and fails the job when the organization policy says Block.
#
# Four things here are not obvious:
#
# 1. Empty baseline scan. Socket Python CLI 2.11.13 only gates and comments when it
#    compares two scans, and its comment lists only findings that are new in that
#    comparison. Comparing with an empty scan makes every finding new, so the whole
#    snapshot is reported. Each run creates its own empty scan in the same Socket
#    repository, before the PR is checked out. Nothing is shared between runs or
#    repositories, so a run never depends on a scan from an earlier run.
# 2. EVENT_ACTION=synchronize. The CLI skips the scan and exits 0 on `reopened`.
#    Forcing one supported action keeps every PR event on the same scan path.
# 3. Reachability with a fallback. The scan first runs with --reach, which analyses
#    the code and lowers findings that cannot be reached. If the first attempt
#    exits 3 without a report, the step scans again without --reach.
#    Accepted risk: for Rust the engine runs build scripts from the PR, and for
#    Python it builds packages that have no wheel. That code runs in a step that
#    holds the Socket token and the job's GitHub token.
#    An analysis that is cut short can still exit 0 with fewer findings. The
#    workflow cannot detect that.
# 4. merge_group fails on purpose. The CLI has no merge queue mode; a clear
#    failure is safer than a green check that scanned nothing.
#
# Exit codes of the scan step: 0 = no Block (Warn is allowed), 1 = Block finding,
# 3 = Socket API or runtime error.

name: Socket

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: write # the CLI creates and updates its own PR comment

concurrency:
  group: socket-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Socket dependency security
    runs-on: ubuntu-24.04 # the lock file is pinned to CPython 3.12 / Linux x86_64
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SCAN_REPO: ${{ github.event.repository.name }}
      SCAN_BRANCH: ${{ github.head_ref }}
      SCAN_COMMIT: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Fail on merge queue events (not supported yet)
        if: github.event_name == 'merge_group'
        run: |
          echo '::error::Socket Python CLI 2.11.13 cannot scan merge_group events. Add merge queue support before enforcing this workflow on repositories that use a merge queue.'
          exit 2

      - name: Check out the scanner lock file from the central repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The only difference from lidofinance/actions: in this test repository the
          # workflow and the lock file live in the repository itself.
          repository: myTestOrg0/dao-voting-ui
          ref: ${{ github.workflow_sha }} # same commit as this workflow file
          path: tooling
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node.js for the reachability engine
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # the engine needs 22.13 or newer

      - name: Install the hash-pinned Socket CLI
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r tooling/.github/tools/socket-python-cli.lock
          socketcli --version
          node --version
          npm --version
          uv --version

      - name: Create the empty baseline scan
        id: baseline
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          BASE_API_URL: https://api.socket.dev/v0
        run: |
          : "${SOCKET_SECURITY_API_KEY:?SOCKET_SECURITY_API_KEY is not available to this repository or event (fork and Dependabot PRs need a separate decision)}"
          mkdir -p "$RUNNER_TEMP/socket" "$RUNNER_TEMP/socket-empty"
          cd "$RUNNER_TEMP/socket-empty"

          # The API accepts only known manifest names. An empty facts document is
          # the placeholder the CLI itself uses for an empty scan.
          echo '{"components": []}' > .socket.facts.json

          # curl reads the API key from stdin, so the key never appears in a
          # process argument list.
          socket_api() {
            printf 'user = "%s:"\n' "$SOCKET_SECURITY_API_KEY" |
              curl -fsS --max-time 60 -K - "$@"
          }

          org="$(socket_api "$BASE_API_URL/organizations" |
            jq -r '.organizations | to_entries | if length == 1 then .[0].value.slug else empty end')"
          if [ -z "$org" ]; then
            echo '::error::The Socket API key must belong to exactly one organization.'
            exit 3
          fi

          # tmp=true keeps this service scan out of the Socket dashboard. The CLI
          # has no flag for it, so this one request goes to the API directly.
          socket_api -X POST \
            -F '.socket.facts.json=@.socket.facts.json' \
            "$BASE_API_URL/orgs/$org/full-scans?repo=$SCAN_REPO&branch=socket-empty-baseline&tmp=true" \
            > "$RUNNER_TEMP/socket/baseline.json"

          scan_id="$(jq -r '.id // empty' "$RUNNER_TEMP/socket/baseline.json")"
          if [ -z "$scan_id" ]; then
            echo '::error::Socket did not return the ID of the empty baseline scan.'
            exit 3
          fi
          echo "scan_id=$scan_id" >> "$GITHUB_OUTPUT"
          echo "org=$org" >> "$GITHUB_OUTPUT"

      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SCAN_COMMIT }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Remove reachability facts files supplied by the PR
        # The CLI uploads every .socket.facts.json it finds, and Socket lowers
        # findings based on that data. A pull request must not be able to supply it.
        working-directory: candidate
        run: |
          find . -path ./.git -prune -o \( -type f -o -type l \) -name '.socket.facts.json*' -print0 |
            while IFS= read -r -d '' file; do
              echo "::warning::Ignoring a reachability facts file committed to the repository: $file"
              rm -f -- "$file"
            done

      - name: Scan the PR snapshot and update the PR comment
        working-directory: candidate
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ github.token }}
          EVENT_ACTION: synchronize
          # Set explicitly so that no .env file can redirect the API key elsewhere.
          BASE_API_URL: https://api.socket.dev/v0
          BASELINE_SCAN_ID: ${{ steps.baseline.outputs.scan_id }}
          # The reachability engine downloads packages with npm. It must never run
          # their install scripts in this step, which holds both tokens.
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          # --base-scan-id        compare with the empty baseline: every finding is new
          # --ignore-commit-files scan even when the PR touches no manifest file
          # --strict-blocking     fail on any Block, not only on new ones
          # --disable-ignore      "@SocketSecurity ignore" PR comments have no effect
          # --disable-overview    one security comment, no second overview comment
          # --reach               analyse the code and lower findings that are not reachable
          # --reach-disable-analytics  do not send analysis statistics to Socket
          scan() {
            socketcli --scm github \
              --owner "$GITHUB_REPOSITORY_OWNER" \
              --repo "$SCAN_REPO" \
              --branch "$SCAN_BRANCH" \
              --commit-sha "$SCAN_COMMIT" \
              --pr-number "$PR_NUMBER" \
              --target-path . \
              --base-scan-id "$BASELINE_SCAN_ID" \
              --ignore-commit-files \
              --strict-blocking \
              --disable-ignore \
              --disable-overview \
              --json-file "$RUNNER_TEMP/socket/report.json" \
              --summary-file "$RUNNER_TEMP/socket/summary.txt" \
              "$@"
          }

          status=0
          scan --reach --reach-disable-analytics || status=$?

          # Exit 3 without a report: the first attempt failed before it assessed
          # anything, most often in the reachability analysis. Scan again without it.
          if [ "$status" -eq 3 ] && [ ! -s "$RUNNER_TEMP/socket/report.json" ]; then
            echo '::warning::The first scan attempt produced no report. Scanning again without reachability analysis.'
            touch "$RUNNER_TEMP/socket/reachability-fallback"
            find . -path ./.git -prune -o -name '.socket.facts.json*' -print0 | xargs -0 rm -f --
            status=0
            scan || status=$?
          fi
          exit "$status"

      - name: Confirm that the scan really assessed this commit
        # A green scan step is not enough: the CLI exits 0 when it skips the
        # comparison. Runs after a Block failure too, but not after a cancel.
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          BASELINE_SCAN_ID: ${{ steps.baseline.outputs.scan_id }}
          SOCKET_ORG: ${{ steps.baseline.outputs.org }}
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          BASE_API_URL: https://api.socket.dev/v0
        run: |
          report="$RUNNER_TEMP/socket/report.json"
          not_scanned() {
            echo "::error::Treat this PR as not scanned: $1."
            exit 3
          }

          [ -n "$BASELINE_SCAN_ID" ] ||
            not_scanned 'no empty baseline scan was created'
          [ -s "$report" ] ||
            not_scanned 'the CLI wrote no report'
          # .scan_failed is not checked: the CLI sets it to true for a Block finding.
          jq -e '.full_scan_id | length > 0' "$report" > /dev/null ||
            not_scanned 'the report has no scan ID'
          jq -e --arg commit "$SCAN_COMMIT" '.commit_sha == $commit' "$report" > /dev/null ||
            not_scanned 'the report belongs to another commit'

          # Ask Socket for the comparison itself. The CLI report does not say which
          # scans were compared or whether the comparison was complete.
          # Both answers are kept next to the report and uploaded with it. curl
          # retries timeouts and 408/429/5xx answers, not 401/403/404.
          socket_api() {
            printf 'user = "%s:"\n' "$SOCKET_SECURITY_API_KEY" |
              curl -fsS --max-time 60 --retry 2 --retry-delay 5 -K - "$@"
          }
          head_scan="$(jq -r '.full_scan_id' "$report")"
          comparisons="$RUNNER_TEMP/socket/comparison-list.json"
          comparison="$RUNNER_TEMP/socket/comparison.json"

          socket_api "$BASE_API_URL/orgs/$SOCKET_ORG/diff-scans?before_full_scan_id=$BASELINE_SCAN_ID&after_full_scan_id=$head_scan" > "$comparisons" ||
            not_scanned 'Socket did not list the comparison'
          comparison_id="$(jq -r 'if (.results | length) == 1 then .results[0].id else empty end' "$comparisons")"
          [ -n "$comparison_id" ] ||
            not_scanned 'Socket has no single comparison of this scan with the empty baseline scan'
          socket_api "$BASE_API_URL/orgs/$SOCKET_ORG/diff-scans/$comparison_id?if_cached=true" > "$comparison" ||
            not_scanned 'Socket did not return the comparison'
          jq -e --arg base "$BASELINE_SCAN_ID" --arg head "$head_scan" \
            '.diff_scan.before_full_scan.id == $base and .diff_scan.after_full_scan.id == $head' "$comparison" > /dev/null ||
            not_scanned 'the comparison used other scans'
          jq -e '.diff_scan.incomplete == false' "$comparison" > /dev/null ||
            not_scanned 'Socket did not confirm that the comparison is complete'

      - name: Publish the job summary
        if: always()
        run: |
          {
            echo '## Socket dependency scan'
            if [ -e "$RUNNER_TEMP/socket/reachability-fallback" ]; then
              echo 'The scan with reachability analysis produced no report. These findings are reported without it.'
            fi
            if [ -s "$RUNNER_TEMP/socket/summary.txt" ]; then
              echo '```text'
              # GitHub rejects step summaries above 1 MiB.
              head -c 900000 "$RUNNER_TEMP/socket/summary.txt"
              echo
              echo '```'
            else
              echo 'No completed assessment. See the failed step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socket-report
          path: ${{ runner.temp }}/socket/
          retention-days: 7
