name: Reusable Socket scan

on:
  workflow_call:
    inputs:
      mode:
        description: Native CLI, server policy, or central VEX
        type: string
        default: policy
      source_ref:
        description: Exact commit or branch to scan
        type: string
        required: true
      source_branch:
        type: string
        required: true
      publish_baseline:
        type: boolean
        default: false
      reach:
        type: boolean
        default: false
    secrets:
      SOCKET_SECURITY_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  scan:
    name: Socket ${{ inputs.mode }}${{ inputs.reach && ' with reachability' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOCKET_ORG: ${{ vars.SOCKET_ORG || 'lido-labs' }}
      SOCKET_REPO: ${{ vars.SOCKET_REPO || github.event.repository.name }}
      SCAN_BRANCH: ${{ inputs.source_branch }}
      SOCKET_MODE: ${{ inputs.mode }}
      SOCKET_REACH: ${{ inputs.reach }}
      SOCKET_PUBLISH_BASELINE: ${{ inputs.publish_baseline }}
    steps:
      - name: Prepare report directory
        run: |
          mkdir -p "$RUNNER_TEMP/socket-report"
          echo "SOCKET_RESULTS_DIR=$RUNNER_TEMP/socket-report" >> "$GITHUB_ENV"
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout scan target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: candidate
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install hash-pinned Socket CLI
        run: bash tooling/.github/scripts/install-socket-cli.sh
      # The native demonstration preserves the CLI's own exit code, with no Python verdict.
      - name: Native CLI report and verdict
        id: native
        if: inputs.mode == 'native'
        working-directory: candidate
        shell: bash
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          socket scan create --org "$SOCKET_ORG" --repo "$SOCKET_REPO" \
            --branch "$SCAN_BRANCH" --commit-hash "$(git rev-parse HEAD)" \
            --no-set-as-alerts-page --report --report-level warn --markdown . \
            | tee "$SOCKET_RESULTS_DIR/native-report.md"
      - name: Scan and evaluate server actions
        if: inputs.mode != 'native'
        working-directory: candidate
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: python3 "$GITHUB_WORKSPACE/tooling/.github/scripts/socket_scan.py"
      - name: Publish unmodified native CLI report
        if: ${{ always() && inputs.mode == 'native' }}
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          echo "## Native Socket CLI verdict: $NATIVE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo 'Warn is reported but only Block fails the native policy verdict.' >> "$GITHUB_STEP_SUMMARY"
          cat "$SOCKET_RESULTS_DIR/native-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: socket-${{ inputs.mode }}-${{ inputs.reach && 'reach' || 'manifest' }}-${{ inputs.publish_baseline && 'baseline' || 'candidate' }}
          path: |
            ${{ env.SOCKET_RESULTS_DIR }}/*.json
            ${{ env.SOCKET_RESULTS_DIR }}/*.md
          retention-days: 7
