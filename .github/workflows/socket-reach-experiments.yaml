# TEST ONLY. Reachability behaviour experiments for the Socket Python CLI.
# No PR comments (--scm api). Delete with the branch.
name: Socket reach experiments 2

on:
  pull_request:

permissions:
  contents: read

jobs:
  experiment:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: default-a, mutate: none, flags: '--reach --reach-disable-analytics'}
          - {name: default-b, mutate: none, flags: '--reach --reach-disable-analytics'}
          - {name: default-c, mutate: none, flags: '--reach --reach-disable-analytics'}
          - {name: timeout-1s-a, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 1s'}
          - {name: timeout-1s-b, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 1s'}
          - {name: timeout-1s-c, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 1s'}
          - {name: timeout-1s-d, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 1s'}
          - {name: timeout-1s-e, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 1s'}
          - {name: timeout-5s, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 5s'}
          - {name: timeout-10s, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 10s'}
          - {name: timeout-20s, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 20s'}
          - {name: timeout-30s, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 30s'}
          - {name: memory-64MB, mutate: none, flags: '--reach --reach-disable-analytics --reach-analysis-memory-limit 64MB'}
          - {name: engine-version-missing, mutate: none, flags: '--reach --reach-disable-analytics --reach-version 0.0.1'}
          - {name: malware, mutate: chalk, flags: '--reach --reach-disable-analytics'}
          - {name: malware-timeout-1s, mutate: chalk, flags: '--reach --reach-disable-analytics --reach-analysis-timeout 1s'}
          - {name: broken-source, mutate: broken, flags: '--reach --reach-disable-analytics'}
          - {name: no-source, mutate: nosrc, flags: '--reach --reach-disable-analytics'}
          - {name: debug, mutate: none, flags: '--reach --reach-disable-analytics --reach-debug'}
    defaults:
      run:
        shell: bash
    env:
      SCAN_REPO: ${{ github.event.repository.name }}
      SCAN_BRANCH: ${{ github.head_ref }}
      SCAN_COMMIT: ${{ github.event.pull_request.head.sha }}
      BASE_API_URL: https://api.socket.dev/v0
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SCAN_COMMIT }}
          path: candidate
          persist-credentials: false
      - name: Install CLI
        run: |
          python -m pip install -q --require-hashes --only-binary=:all: -r candidate/.github/tools/socket-python-cli.lock
      - name: Create the empty baseline
        id: baseline
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/socket" "$RUNNER_TEMP/socket-empty"
          cd "$RUNNER_TEMP/socket-empty"
          echo '{"components": []}' > .socket.facts.json
          socket_api() { printf 'user = "%s:"\n' "$SOCKET_SECURITY_API_KEY" | curl -fsS --max-time 60 -K - "$@"; }
          org="$(socket_api "$BASE_API_URL/organizations" | jq -r '.organizations | to_entries | .[0].value.slug')"
          id="$(socket_api -X POST -F '.socket.facts.json=@.socket.facts.json' "$BASE_API_URL/orgs/$org/full-scans?repo=$SCAN_REPO&branch=socket-empty-baseline&tmp=true" | jq -r .id)"
          echo "scan_id=$id" >> "$GITHUB_OUTPUT"
      - name: Mutate the candidate
        working-directory: candidate
        run: |
          case "${{ matrix.mutate }}" in
            chalk)
              mkdir socket-block-test
              echo '{"name":"socket-block-test","version":"1.0.0","private":true,"dependencies":{"chalk":"5.6.1"}}' > socket-block-test/package.json ;;
            broken)
              mkdir -p pages
              printf 'import x from "lodash";\nexport default function ( {{{ => <div>;;; const = = 1\n' > pages/socket-broken-test.tsx ;;
            nosrc)
              find . -path ./.git -prune -o -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 rm -f -- ;;
          esac
          git status --short | wc -l
      - name: Scan
        working-directory: candidate
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          BASELINE_SCAN_ID: ${{ steps.baseline.outputs.scan_id }}
        run: |
          out="$RUNNER_TEMP/socket"
          scan() {
            socketcli --scm api --repo "$SCAN_REPO" --branch "$SCAN_BRANCH" --commit-sha "$SCAN_COMMIT" \
              --target-path . --base-scan-id "$BASELINE_SCAN_ID" --ignore-commit-files --strict-blocking \
              --json-file "$out/report.json" "$@"
          }
          start=$(date +%s)
          first=0
          scan ${{ matrix.flags }} > "$out/cli.log" 2>&1 || first=$?
          final=$first; fallback=no
          if [ "$first" -eq 3 ] && [ ! -s "$out/report.json" ]; then
            fallback=yes
            find . -path ./.git -prune -o -name '.socket.facts.json*' -print0 | xargs -0 rm -f --
            final=0
            scan > "$out/cli-fallback.log" 2>&1 || final=$?
          fi
          clean() { sed -E 's/\x1b\[[0-9;]*m//g' "$out/cli.log"; }
          unique=$(jq '[.new_alerts[]|"\(.pkg_name)@\(.pkg_version) \(.type)"]|unique|length' "$out/report.json" 2>/dev/null || echo none)
          block=$(jq '[.new_alerts[]|select(.error==true)|"\(.pkg_name)@\(.pkg_version)"]|unique|join(",")' "$out/report.json" 2>/dev/null || echo none)
          table=$(clean | grep -E 'root project\)' | head -1 | tr -s ' ' | cut -c1-110)
          echo "RESULT|${{ matrix.name }}|first=$first|fallback=$fallback|final=$final|unique=$unique|block=$block|sec=$(( $(date +%s) - start ))|$table"
          echo "--- details"
          clean | grep -iE 'Analysis Error|failed|Command failed|not possible|unreachable from|Running (import|full)|ignore-scripts|npm (ci|install)|yarn install|pnpm install|no source|Missing|Coana CLI version|timed out|out of memory|heap' | grep -viE 'High CVE|Critical CVE' | cut -c1-300 | head -25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reach-${{ matrix.name }}
          path: ${{ runner.temp }}/socket/
          retention-days: 3
