# TEST ONLY. How many findings does reachability remove for a Python and a Go
# project? Each project is scanned twice: without --reach and with it.
# No PR comments (--scm api). Delete with the branch.
name: Socket reach benefit

on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [python, go]
    defaults:
      run:
        shell: bash
    env:
      SCAN_REPO: ${{ github.event.repository.name }}
      SCAN_BRANCH: ${{ github.head_ref }}
      SCAN_COMMIT: ${{ github.event.pull_request.head.sha }}
      BASE_API_URL: https://api.socket.dev/v0
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SCAN_COMMIT }}
          path: candidate
          persist-credentials: false
      - name: Install CLI
        run: |
          python -m pip install -q --require-hashes --only-binary=:all: -r candidate/.github/tools/socket-python-cli.lock
      - name: Create the empty baseline
        id: baseline
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/socket" "$RUNNER_TEMP/socket-empty"
          cd "$RUNNER_TEMP/socket-empty"
          echo '{"components": []}' > .socket.facts.json
          socket_api() { printf 'user = "%s:"\n' "$SOCKET_SECURITY_API_KEY" | curl -fsS --max-time 60 -K - "$@"; }
          org="$(socket_api "$BASE_API_URL/organizations" | jq -r '.organizations | to_entries | .[0].value.slug')"
          id="$(socket_api -X POST -F '.socket.facts.json=@.socket.facts.json' "$BASE_API_URL/orgs/$org/full-scans?repo=$SCAN_REPO&branch=socket-empty-baseline&tmp=true" | jq -r .id)"
          echo "scan_id=$id" >> "$GITHUB_OUTPUT"
      - name: Build the project
        run: |
          mkdir "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
          "$GITHUB_WORKSPACE/candidate/.github/benefit/prepare.sh" "${{ matrix.scenario }}"
      - name: Scan without and with reachability
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          BASELINE_SCAN_ID: ${{ steps.baseline.outputs.scan_id }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          cd "$RUNNER_TEMP/work/probe"
          out="$RUNNER_TEMP/socket"
          scan() {
            local name="$1"; shift
            local rc=0
            local start=$SECONDS
            socketcli --scm api --repo "$SCAN_REPO" --branch "$SCAN_BRANCH" --commit-sha "$SCAN_COMMIT" \
              --target-path . --base-scan-id "$BASELINE_SCAN_ID" --ignore-commit-files --strict-blocking \
              --json-file "$out/report-$name.json" "$@" > "$out/cli-$name.log" 2>&1 || rc=$?
            echo "RESULT|$SCENARIO|$name|exit=$rc|seconds=$((SECONDS - start))"
            if [ -s "$out/report-$name.json" ]; then
              jq -r '[.new_alerts[]? | "\(.purl) | \(.severity) | \(.type)"] | unique | "groups=\(length)", .[]' "$out/report-$name.json"
            fi
          }
          scan plain
          rm -f .socket.facts.json
          scan reach --reach --reach-disable-analytics --reach-debug
          echo "--- reachability table"
          sed -E 's/\x1b\[[0-9;]*m//g' "$out/cli-reach.log" | grep -E "│|Legend|NoReach=" | cut -c1-200 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reach-benefit-${{ matrix.scenario }}
          path: ${{ runner.temp }}/socket/
          retention-days: 3
