name: Socket PR test

'on':
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socket-pr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: Socket dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCAN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SCAN_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Socket CLI
        working-directory: ${{ runner.temp }}
        run: |
          npm install --global socket@1.13.1
          socket --version

      - name: Prepare dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/socket-snapshot"
          mkdir -p "$snapshot"
          git show "${SCAN_SHA}:package.json" > "$snapshot/package.json"
          git show "${SCAN_SHA}:yarn.lock" > "$snapshot/yarn.lock"
          test -s "$snapshot/package.json"
          test -s "$snapshot/yarn.lock"

      - name: Run Socket scan
        shell: bash
        working-directory: ${{ runner.temp }}/socket-snapshot
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SOCKET_SECURITY_API_KEY" ]; then
            echo '::error::SOCKET_SECURITY_API_KEY is unavailable.'
            exit 1
          fi
          socket scan create \
            --org lido-labs \
            --repo dao-voting-ui \
            --branch "$SCAN_BRANCH" \
            --commit-hash "$SCAN_SHA" \
            --no-set-as-alerts-page \
            --report \
            --report-level warn \
            --json .

      - name: Inspect original POC scan and policy
        if: ${{ always() }}
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          SOCKET_SCAN_ID: b2d0b62d-eb99-4dc2-9f4b-0381e35a2997
        run: python3 .github/scripts/socket-report-diagnostics.py
