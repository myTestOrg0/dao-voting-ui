name: Socket develop baseline

'on':
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socket-develop-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Publish develop inventory and alerts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOCKET_ORG: ${{ vars.SOCKET_ORG || 'lido-labs' }}
      SOCKET_REPO: ${{ vars.SOCKET_REPO || github.event.repository.name }}
      SOCKET_PUBLISH_BASELINE: 'true'
      SOCKET_FAIL_ON_FINDINGS: 'true'
      SCAN_BRANCH: develop
    steps:
      # During manual POC runs tooling comes from the selected workflow branch.
      # The scan target is always a separate, real develop checkout.
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout actual develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          path: candidate
          persist-credentials: false
      - name: Record scanned commit and report directory
        working-directory: candidate
        run: |
          echo "SCAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOCKET_RESULTS_DIR=$RUNNER_TEMP/socket-baseline-report" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install hash-pinned Socket CLI
        run: bash tooling/.github/scripts/install-socket-cli.sh
      - name: Publish develop as Socket dashboard baseline
        working-directory: candidate
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: bash "$GITHUB_WORKSPACE/tooling/.github/scripts/socket-create-scan.sh"
      - name: Read server actions and show baseline vulnerabilities
        if: ${{ always() }}
        working-directory: candidate
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: python3 "$GITHUB_WORKSPACE/tooling/.github/scripts/socket-summary.py"
      - name: Verify dashboard head points to this scan
        if: ${{ always() }}
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          from urllib.parse import quote
          spec = importlib.util.spec_from_file_location('summary', 'tooling/.github/scripts/socket-summary.py')
          summary = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(summary)
          folder = Path(os.environ['SOCKET_RESULTS_DIR'])
          report = json.loads((folder / 'report.json').read_text())
          repo = json.loads(summary.get_api(os.environ['SOCKET_ORG'], 'repos/' + quote(os.environ['SOCKET_REPO'], safe='')))
          info = {key: repo.get(key) for key in ('id', 'name', 'default_branch', 'head_full_scan_id')}
          info['expected_scan_id'] = report['scanId']
          info['matches'] = info['head_full_scan_id'] == report['scanId'] and info['default_branch'] == 'develop'
          (folder / 'baseline-head.json').write_text(json.dumps(info, indent=2))
          print(json.dumps(info, indent=2))
          if not info['matches']:
              raise SystemExit('Socket dashboard head was not updated to the develop scan')
          PY
      - name: Upload baseline report even when findings fail the check
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: socket-baseline-report
          path: |
            ${{ env.SOCKET_RESULTS_DIR }}/*.json
            ${{ env.SOCKET_RESULTS_DIR }}/*.md
          retention-days: 7
