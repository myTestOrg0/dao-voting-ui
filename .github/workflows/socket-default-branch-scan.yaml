# Socket scan of the default branch of every repository listed in repos.txt
# (one link per line: https://github.com/<owner>/<name>).
#
# Each repository gets one full scan that becomes the head scan of its default
# branch in Socket, so its alerts show up in the Socket dashboard. The run
# summary lists every repository with its numbers of malware alerts and of
# critical and high vulnerabilities, and a link to its results in Socket.
#
# One job scans all repositories, one after another: a job per repository would
# spend most of its time on setup and is billed at least a minute each.
#
# Only the manifest files of a repository are uploaded. No dependencies are
# installed, no code from a repository is executed, and no reachability analysis
# is run.
#
# A repository that cannot be scanned does not stop the others. The job never
# fails on findings; it fails when at least one repository was not scanned.
#
# Secrets:
#   SOCKET_SECURITY_API_KEY  Socket API key of exactly one organization, allowed
#                            to create full scans and to read them.
#   APP_ID, APP_PRIVATE_KEY  A GitHub App with read access to repository contents,
#                            installed into the listed repositories. For every
#                            repository a token limited to it is requested
#                            (scripts/get_token.py). Without the App, or for a
#                            repository it is not installed into, only public
#                            repositories can be checked out.

name: Socket default branch scan

on:
  push:
    branches: [test/socket-default-branch-scan] # TEST ONLY
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a second run waits for the first one to finish.
concurrency:
  group: socket-default-branch-scan

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: Scan the default branches
    runs-on: ubuntu-24.04 # the lock file is pinned to CPython 3.12 / Linux x86_64
    timeout-minutes: 90
    env:
      # The CLI reads the API address from this variable. Set explicitly, so that
      # the Socket API key cannot be sent anywhere else.
      BASE_API_URL: https://api.socket.dev/v0
    steps:
      - name: Check out the repository list, the token script and the CLI lock file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build the list of repositories
        run: |
          # Paths shared by the steps below.
          #   REPO_LIST  owner <tab> name, one repository per line
          #   TARGETS    the checkout of a repository: <TARGETS>/<name>
          #   STATE      what is known about a repository: <STATE>/<name>/branch,
          #              sha, link, counts.json, and error when it was not scanned
          REPO_LIST="$RUNNER_TEMP/repos.tsv"
          {
            echo "REPO_LIST=$REPO_LIST"
            echo "TARGETS=$RUNNER_TEMP/targets"
            echo "STATE=$RUNNER_TEMP/state"
          } >> "$GITHUB_ENV"

          # The links of repos.txt: no comments and empty lines, no surrounding
          # spaces, no trailing slash.
          links="$(
            { grep -v -E '^[[:space:]]*(#|$)' tooling/repos.txt || true; } |
              sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s#/$##'
          )"
          if [ -z "$links" ]; then
            echo '::error::The repository list is empty.'
            exit 2
          fi

          bad="$(grep -v -E '^https://github\.com/[A-Za-z0-9-]+/[A-Za-z0-9._-]+$' <<< "$links" || true)"
          if [ -n "$bad" ]; then
            echo "::error::Not a repository link of the form https://github.com/<owner>/<name>: $bad"
            exit 2
          fi
          # Socket identifies a repository by its name alone, so two repositories
          # with one name, even from different owners, would share one entry there.
          duplicates="$(sed -E 's#.*/##' <<< "$links" | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "::error::Repository name listed more than once: $duplicates"
            exit 2
          fi

          sed -E 's#^https://github\.com/([^/]+)/([^/]+)$#\1\t\2#' <<< "$links" > "$REPO_LIST"
          echo "Repositories to scan: $(wc -l < "$REPO_LIST")"

      - name: Check out the default branch of every repository
        # The first of two passes over the list. Every repository is checked out
        # here, before the Socket CLI is installed, so the private key of the App
        # is never present next to third-party packages.
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          # Used when there is no App token. It can read public repositories only.
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          not_scanned() { # <name> <reason>
            echo "$2" > "$STATE/$1/error"
            echo "::error::$1 is not scanned: $2."
          }

          check_out() { # <owner> <name>
            local owner="$1" name="$2"
            local state="$STATE/$name" target="$TARGETS/$name"
            local token_file="$RUNNER_TEMP/token.out" token auth facts

            # The same scheme as scripts/get_token.py in lidofinance/infra-mainnet.
            # The token can only read the contents of this one repository. The
            # script writes it as a step output; here that output is a file of
            # this step, read and removed at once.
            : > "$token_file"
            if ! GITHUB_OUTPUT="$token_file" TARGET_OWNER="$owner" TARGET_REPO="$name" \
              python tooling/scripts/get_token.py; then
              not_scanned "$name" 'no GitHub App token was received'
              return
            fi
            token="$(sed -n 's/^ghs_token=//p' "$token_file")"
            rm -f "$token_file"
            token="${token:-$WORKFLOW_TOKEN}"

            # The token goes to git through the environment: it is neither in a
            # process argument list nor saved in the checkout. git itself does
            # not get the App key. No code of the repository runs on a clone;
            # Git LFS files are not downloaded.
            auth="$(printf 'x-access-token:%s' "$token" | base64 -w 0)"
            echo "::add-mask::$auth"
            if ! env -u APP_ID -u APP_PRIVATE_KEY -u WORKFLOW_TOKEN \
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              GIT_TERMINAL_PROMPT=0 \
              GIT_LFS_SKIP_SMUDGE=1 \
              git clone --quiet --depth 1 --no-tags "https://github.com/$owner/$name" "$target"; then
              not_scanned "$name" 'the default branch could not be checked out'
              return
            fi

            if ! git -C "$target" symbolic-ref --short HEAD > "$state/branch" ||
              ! git -C "$target" rev-parse HEAD > "$state/sha"; then
              not_scanned "$name" 'the default branch could not be determined'
              return
            fi
            echo "Checked out $(cat "$state/branch") at $(cat "$state/sha")"

            # With a git checkout, Socket Python CLI 2.11.13 looks at the files of
            # the last commit and may compare scans instead of creating one.
            # Without .git it always creates a full scan and returns its link.
            rm -rf "$target/.git"

            # The CLI uploads a manifest that is a symbolic link by following it.
            # A link named like a manifest could point outside the checkout, and
            # that file of the runner would be sent to Socket.
            find "$target" -type l -print -delete

            # The CLI uploads every .socket.facts.json it finds, and Socket lowers
            # findings based on that data. No scanned repository may supply it.
            facts="$(find "$target" -type f -name '.socket.facts.json*' -print)"
            if [ -n "$facts" ]; then
              echo "$facts"
              not_scanned "$name" 'it contains a reachability facts file'
            fi
          }

          mkdir -p "$TARGETS" "$STATE"
          # The list is read from descriptor 3, so that no command in the loop
          # can consume it from the standard input.
          while IFS=$'\t' read -r owner name <&3; do
            echo "::group::$owner/$name"
            mkdir -p "$STATE/$name"
            # One repository that fails must not stop the others.
            check_out "$owner" "$name" || not_scanned "$name" 'the checkout stopped on an unexpected error'
            echo '::endgroup::'
          done 3< "$REPO_LIST"

      - name: Install the hash-pinned Socket CLI
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r tooling/.github/tools/socket-python-cli.lock
          socketcli --version

      - name: Scan every repository
        # The second pass. The Socket API key is present only here, after all
        # repositories have been fetched.
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          : "${SOCKET_SECURITY_API_KEY:?SOCKET_SECURITY_API_KEY is not available to this repository}"

          not_scanned() { # <name> <reason>
            echo "$2" > "$STATE/$1/error"
            echo "::error::$1 is not scanned: $2."
          }

          # Counts the findings of a scan for the table in the run summary. When
          # they cannot be read, it warns and the table shows "n/a": the
          # repository is scanned anyway.
          count_findings() { # <name>
            local name="$1" state="$STATE/$1" link org scan_id

            link="$(head -n 1 "$state/link")"
            if ! [[ "$link" =~ ^https://socket\.dev/dashboard/org/([A-Za-z0-9._-]+)/sbom/([0-9a-f-]+)$ ]]; then
              echo "::warning::The findings of $name are not counted: the report link has an unexpected form."
              return
            fi
            org="${BASH_REMATCH[1]}"
            scan_id="${BASH_REMATCH[2]}"

            # Every package of the scan with its alerts, one JSON document per
            # line. curl reads the API key from stdin, so the key never appears
            # in a process argument list.
            if ! printf 'user = "%s:"\n' "$SOCKET_SECURITY_API_KEY" |
              curl -fsS --max-time 300 --retry 2 --retry-delay 5 -K - \
                "$BASE_API_URL/orgs/$org/full-scans/$scan_id" > "$state/scan.ndjson"; then
              echo "::warning::The findings of $name are not counted: Socket did not return the scan."
              return
            fi

            # One alert is one finding in one package version. Alerts that the
            # organization policy sets to "ignore" are left out.
            #   malware   known malware and AI-detected potential malware
            #   critical  vulnerabilities of critical severity
            #   high      vulnerabilities of high severity
            if ! jq -s -c '
              [.[] | (.alerts // [])[] | select(.action != "ignore")]
              | {
                  malware: map(select(.type == "malware" or .type == "gptMalware")) | length,
                  critical: map(select(.category == "vulnerability" and .severity == "critical")) | length,
                  high: map(select(.category == "vulnerability" and .severity == "high")) | length
                }
            ' "$state/scan.ndjson" > "$state/counts.json"; then
              rm -f "$state/counts.json"
              echo "::warning::The findings of $name are not counted: the answer of Socket could not be read."
              return
            fi
            echo "Findings: $(cat "$state/counts.json")"
          }

          scan() { # <owner> <name>
            local owner="$1" name="$2"
            local state="$STATE/$name" target="$TARGETS/$name"

            # --default-branch    make this scan the head scan of the default
            #                     branch, which is what the Socket dashboard shows
            # --report-link-file  the link to the scan in Socket
            if ! (
              cd "$target" &&
                socketcli \
                  --repo "$name" \
                  --branch "$(cat "$state/branch")" \
                  --commit-sha "$(cat "$state/sha")" \
                  --target-path . \
                  --default-branch \
                  --report-link-file "$state/link"
            ) || [ ! -s "$state/link" ]; then
              rm -f "$state/link"
              not_scanned "$name" 'the Socket scan failed'
              return
            fi
            echo "::notice::$owner/$name: $(head -n 1 "$state/link")"
            count_findings "$name"
          }

          while IFS=$'\t' read -r owner name <&3; do
            echo "::group::$owner/$name"
            if [ -e "$STATE/$name/error" ]; then
              echo "Skipped: $(cat "$STATE/$name/error")."
            else
              # One repository that fails must not stop the others.
              scan "$owner" "$name" || not_scanned "$name" 'the scan stopped on an unexpected error'
            fi
            rm -rf "${TARGETS:?}/$name"
            echo '::endgroup::'
          done 3< "$REPO_LIST"

      - name: Publish the list of results
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s "$REPO_LIST" ]; then
            echo '::error::The list of repositories was not built.'
            exit 1
          fi

          failed=0
          {
            echo '## Socket default branch scan'
            echo
            echo 'Malware, Critical and High are numbers of alerts: one finding in one package version.'
            echo 'Critical and High count vulnerabilities only. Alerts that the Socket policy ignores are left out.'
            echo
            echo '| Repository | Branch | Malware | Critical | High | Results in Socket |'
            echo '| --- | --- | ---: | ---: | ---: | --- |'
            while IFS=$'\t' read -r owner name; do
              state="$STATE/$name"
              branch="$(cat "$state/branch" 2> /dev/null || true)"
              counts=' | | '
              if [ -s "$state/link" ] && [ ! -e "$state/error" ]; then
                link="$(head -n 1 "$state/link")"
                # "n/a": scanned, but the findings could not be counted.
                counts='n/a | n/a | n/a'
                if [ -s "$state/counts.json" ]; then
                  counts="$(jq -r '[.malware, .critical, .high] | join(" | ")' "$state/counts.json")"
                fi
              else
                reason="$(cat "$state/error" 2> /dev/null || echo 'the job stopped before this repository')"
                link="not scanned: $reason"
                failed=$((failed + 1))
              fi
              echo "| https://github.com/$owner/$name | ${branch:+\`$branch\`} | $counts | $link |"
            done < "$REPO_LIST"
          } > results.md
          cat results.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed repositories were not scanned."
            exit 1
          fi

      - name: Upload the list of results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socket-default-branch-scan-results
          path: results.md
          retention-days: 30
