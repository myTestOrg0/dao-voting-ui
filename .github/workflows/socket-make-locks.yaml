# TEST ONLY. Generates lock files for the sample projects. Delete with the branch.
name: Socket make locks

on:
  pull_request:

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Generate lock files
        run: |
          python -m pip install -q --require-hashes --only-binary=:all: -r .github/tools/socket-python-cli.lock
          mkdir -p "$RUNNER_TEMP/locks"
          (cd rustprobe && cargo --version && cargo generate-lockfile && cp Cargo.lock "$RUNNER_TEMP/locks/")
          (cd pyprobe2 && uv lock && cp uv.lock "$RUNNER_TEMP/locks/")
          wc -l "$RUNNER_TEMP"/locks/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locks
          path: ${{ runner.temp }}/locks/
          retention-days: 1
