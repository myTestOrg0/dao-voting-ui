name: Lab native exception CLI comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-exception-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SOCKET_ORG: lido-labs
      SOCKET_REPO: dao-voting-ui
      SCAN_BRANCH: native-exception-comparison-${{ github.run_id }}
    steps:
      - name: Prepare results
        run: |
          mkdir -p "$RUNNER_TEMP/native-resolution-comparison"
          echo "SOCKET_RESULTS_DIR=$RUNNER_TEMP/native-resolution-comparison" >> "$GITHUB_ENV"
      - name: Checkout trusted test tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout fixed application commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1b4f7806567184dc99e5ff74bc0010943bf654c0
          path: candidate
          persist-credentials: false
      - name: Record exact source SHA
        working-directory: candidate
        run: echo "SCAN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install hash-pinned Socket CLI
        run: |
          echo '8e08f1210ed72a39f14ab565083a228591e50ed9e4716aa5e4d2c3f1fa46c023  tooling/.github/tools/socket-cli.lock' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/socket-cli"
          jq '.packages[""] + {private: true}' tooling/.github/tools/socket-cli.lock > "$RUNNER_TEMP/socket-cli/package.json"
          cp tooling/.github/tools/socket-cli.lock "$RUNNER_TEMP/socket-cli/package-lock.json"
          # npm verifies the SHA-512 integrity of the CLI and each locked dependency.
          npm ci --prefix "$RUNNER_TEMP/socket-cli" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/socket-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/socket-cli/node_modules/.bin/socket" --version
      - name: Compare before, active and revoked native resolution
        working-directory: candidate
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: bash "$GITHUB_WORKSPACE/tooling/.github/scripts/native-resolution-compare.sh"
      - name: Retry owned-resolution cleanup
        if: always()
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -f tooling/.github/scripts/native-resolution-compare.sh ]; then
            bash tooling/.github/scripts/native-resolution-compare.sh cleanup
          fi
      - name: Upload comparison evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-exception-cli-comparison
          path: |
            ${{ env.SOCKET_RESULTS_DIR }}/comparison.*
            ${{ env.SOCKET_RESULTS_DIR }}/deleted.json
            ${{ env.SOCKET_RESULTS_DIR }}/*/comparison.json
            ${{ env.SOCKET_RESULTS_DIR }}/*/cli-report.json
            ${{ env.SOCKET_RESULTS_DIR }}/*/report.json
            ${{ env.SOCKET_RESULTS_DIR }}/*/target-artifact.json
          retention-days: 7
