name: Lab native-python resolution comparison

on:
  workflow_dispatch:
    inputs:
      probe_resolution_access:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: native-python-resolution-comparison
  cancel-in-progress: false

jobs:
  compare:
    if: ${{ !inputs.probe_resolution_access }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SOCKET_ORG: lido-labs
      SOCKET_REPO: dao-voting-ui
      SCAN_BRANCH: native-python-comparison-${{ github.run_id }}
      PR_NUMBER: '2'
    steps:
      - name: Prepare results
        run: |
          mkdir -p "$RUNNER_TEMP/native-python-resolution"
          echo "SOCKET_RESULTS_DIR=$RUNNER_TEMP/native-python-resolution" >> "$GITHUB_ENV"
      - name: Checkout trusted test tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout fixed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6d2adee5606bbbd67ae7e2772c8b853ebd69a263
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Record source SHA
        working-directory: candidate
        run: echo "SCAN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hash-pinned Python CLI
        run: |
          echo 'b4e741886bd223db7a91ac7c41a2a09137aafd9018a8fd318df4b6858e9225cc  tooling/.github/tools/socket-python-cli.lock' | sha256sum --check
          python -m pip install --require-hashes --only-binary=:all: -r tooling/.github/tools/socket-python-cli.lock
          socketcli --version
      - name: Compare native Python before, active and revoked resolution
        working-directory: candidate
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/tooling/.github/scripts/native-python-resolution-compare.sh"
      - name: Retry owned-resolution cleanup
        if: always()
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -f tooling/.github/scripts/native-python-resolution-compare.sh ]; then
            bash tooling/.github/scripts/native-python-resolution-compare.sh cleanup
          fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-python-resolution-comparison
          path: |
            ${{ env.SOCKET_RESULTS_DIR }}/comparison.*
            ${{ env.SOCKET_RESULTS_DIR }}/deleted.json
            ${{ env.SOCKET_RESULTS_DIR }}/baseline.json
            ${{ env.SOCKET_RESULTS_DIR }}/*/comparison.json
            ${{ env.SOCKET_RESULTS_DIR }}/*/python-report.json
            ${{ env.SOCKET_RESULTS_DIR }}/*/python-pr-comment.md
            ${{ env.SOCKET_RESULTS_DIR }}/*/target-artifact.json
          retention-days: 7

  probe:
    if: inputs.probe_resolution_access
    runs-on: ubuntu-latest
    steps:
      - name: Read target metadata and dry-run exact resolution selectors
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        shell: bash
        run: |
          base=https://api.socket.dev/v0/orgs/lido-labs
          curl --fail-with-body --silent --show-error --user "$SOCKET_SECURITY_API_KEY:" \
            "$base/repos/dao-voting-ui" | jq '{id,name,slug,integration_type,integration_org_slug,workspace,default_branch}'
          for repository in dao-voting-ui myTestOrg0/dao-voting-ui; do
            jq -n --arg repo "$repository" '{reason:"other",reason_text:"Dry run only",comment:"Native Python access probe; no record is saved",vigil_selector:{"location.repo":$repo,"artifact.type":"npm","artifact.namespace":"","artifact.name":"lodash","artifact.version":"4.17.11","finding.alertType":"criticalCVE","finding.cveId":"CVE-2019-10744"}}' > "$RUNNER_TEMP/request.json"
            status=$(curl --silent --show-error --connect-timeout 15 --max-time 60 \
              --user "$SOCKET_SECURITY_API_KEY:" --header 'Content-Type: application/json' \
              --request POST --data-binary "@$RUNNER_TEMP/request.json" --output "$RUNNER_TEMP/response.json" \
              --write-out '%{http_code}' "$base/alerts/resolutions?dry_run=true")
            echo "Selector $repository: HTTP $status"
            jq . "$RUNNER_TEMP/response.json"
          done
