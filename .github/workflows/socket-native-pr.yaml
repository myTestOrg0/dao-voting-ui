name: Socket native CLI PR

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run_develop_checks:
        description: Run develop baseline and reachability checks before this PR is merged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: socket-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native CLI verdict (optional)
    if: ${{ !inputs.run_develop_checks }}
    uses: ./.github/workflows/socket-scan.yaml
    with:
      mode: native
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source_branch: ${{ github.head_ref || github.ref_name }}
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
  develop:
    name: Manual develop validation
    if: ${{ inputs.run_develop_checks }}
    uses: ./.github/workflows/socket-develop-baseline.yaml
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
