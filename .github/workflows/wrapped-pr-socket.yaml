name: Wrapped PR Socket

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wrapped-socket-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Wrapped PR — ${{ matrix.mode }} (optional)
    strategy:
      fail-fast: false
      matrix:
        mode: [policy, vex]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SOCKET_ORG: ${{ vars.SOCKET_ORG || 'lido-labs' }}
      SOCKET_REPO: ${{ vars.SOCKET_REPO || github.event.repository.name }}
      SCAN_BRANCH: ${{ github.head_ref || github.ref_name }}
      SOCKET_MODE: ${{ matrix.mode }}
    steps:
      - name: Prepare report directory
        run: |
          mkdir -p "$RUNNER_TEMP/socket-report"
          echo "SOCKET_RESULTS_DIR=$RUNNER_TEMP/socket-report" >> "$GITHUB_ENV"
          echo "SOCKET_VEX_DIR=$RUNNER_TEMP/socket-vex" >> "$GITHUB_ENV"
      - name: Checkout workflow tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout scan target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Record scanned commit
        working-directory: candidate
        run: |
          echo "SCAN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install hash-pinned Socket CLI
        run: |
          echo '8e08f1210ed72a39f14ab565083a228591e50ed9e4716aa5e4d2c3f1fa46c023  tooling/.github/tools/socket-cli.lock' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/socket-cli"
          jq '.packages[""] + {private: true}' tooling/.github/tools/socket-cli.lock > "$RUNNER_TEMP/socket-cli/package.json"
          cp tooling/.github/tools/socket-cli.lock "$RUNNER_TEMP/socket-cli/package-lock.json"
          # npm verifies the SHA-512 integrity of the CLI and each locked dependency.
          npm ci --prefix "$RUNNER_TEMP/socket-cli" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/socket-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/socket-cli/node_modules/.bin/socket" --version
      - name: Create full PR snapshot scan
        id: scan
        working-directory: candidate
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          socket scan create --org "$SOCKET_ORG" --repo "$SOCKET_REPO" \
            --branch "$SCAN_BRANCH" --commit-hash "$SCAN_COMMIT" \
            --no-set-as-alerts-page \
            --json . | tee "$SOCKET_RESULTS_DIR/cli-output.log"
      - name: Download server findings
        id: download
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          scan_id=$(python3 tooling/.github/scripts/wrapped_report.py scan-id)
          # Retry transient network/server errors; authentication failures remain failures.
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 \
            --connect-timeout 15 --max-time 120 --user "$SOCKET_SECURITY_API_KEY:" \
            "https://api.socket.dev/v0/orgs/$SOCKET_ORG/full-scans/$scan_id?include_license_details=true" \
            --output "$SOCKET_RESULTS_DIR/scan-artifacts.ndjson"
      - name: Download own VEX snapshot
        id: vex
        if: matrix.mode == 'vex'
        run: |
          # DHI and Aqua are image-only feeds; this PR scan reads only our application VEX.
          vex_repository=$(jq -r '.sources[0].repository' tooling/.github/socket-vex-sources.json)
          vex_ref=$(jq -r '.sources[0].ref' tooling/.github/socket-vex-sources.json)
          test "$vex_repository" = 'myTestOrg0/vexel'
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone --quiet --depth 1 \
            --single-branch --branch "$vex_ref" -- "https://github.com/$vex_repository.git" "$SOCKET_VEX_DIR"
          git -C "$SOCKET_VEX_DIR" rev-parse HEAD > "$SOCKET_VEX_DIR/revision.txt"
      - name: Write Summary and return the policy verdict
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VEX_OUTCOME: ${{ steps.vex.outcome }}
        run: |
          python3 tooling/.github/scripts/wrapped_report.py
      - name: Report setup failure if no Summary was produced
        if: failure()
        run: |
          if [ ! -f "$SOCKET_RESULTS_DIR/summary.md" ]; then
            echo '## Socket infrastructure error' >> "$GITHUB_STEP_SUMMARY"
            echo 'No completed assessment is available. See the failed setup/scan step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload structured report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wrapped-pr-socket-${{ matrix.mode }}
          path: |
            ${{ env.SOCKET_RESULTS_DIR }}/*.json
            ${{ env.SOCKET_RESULTS_DIR }}/*.md
          retention-days: 7
