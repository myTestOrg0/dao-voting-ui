# TEST ONLY. Does the reachability engine run project code for Rust, Go and Poetry
# projects? No PR comments (--scm api). Delete with the branch.
name: Socket reach cgo

on:
  pull_request:

permissions:
  contents: read

jobs:
  experiment:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [cgo, cgo-broken]
    defaults:
      run:
        shell: bash
    env:
      SCAN_REPO: ${{ github.event.repository.name }}
      SCAN_BRANCH: ${{ github.head_ref }}
      SCAN_COMMIT: ${{ github.event.pull_request.head.sha }}
      BASE_API_URL: https://api.socket.dev/v0
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SCAN_COMMIT }}
          path: candidate
          persist-credentials: false
      - name: Install CLI
        run: |
          python -m pip install -q --require-hashes --only-binary=:all: -r candidate/.github/tools/socket-python-cli.lock
          node --version; npm --version; uv --version
      - name: Create the empty baseline
        id: baseline
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/socket" "$RUNNER_TEMP/socket-empty"
          cd "$RUNNER_TEMP/socket-empty"
          echo '{"components": []}' > .socket.facts.json
          socket_api() { printf 'user = "%s:"\n' "$SOCKET_SECURITY_API_KEY" | curl -fsS --max-time 60 -K - "$@"; }
          org="$(socket_api "$BASE_API_URL/organizations" | jq -r '.organizations | to_entries | .[0].value.slug')"
          id="$(socket_api -X POST -F '.socket.facts.json=@.socket.facts.json' "$BASE_API_URL/orgs/$org/full-scans?repo=$SCAN_REPO&branch=socket-empty-baseline&tmp=true" | jq -r .id)"
          echo "scan_id=$id" >> "$GITHUB_OUTPUT"
      - name: Build the probe project
        run: |
          mkdir "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
          "$GITHUB_WORKSPACE/candidate/.github/langprobe/prepare.sh" "${{ matrix.scenario }}"
      - name: Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          BASELINE_SCAN_ID: ${{ steps.baseline.outputs.scan_id }}
          GH_API_TOKEN: placeholder-not-a-token
          SCENARIO: ${{ matrix.scenario }}
        run: |
          cd "$RUNNER_TEMP/work/probe"
          out="$RUNNER_TEMP/socket"
          rc=0
          socketcli --scm api --repo "$SCAN_REPO" --branch "$SCAN_BRANCH" --commit-sha "$SCAN_COMMIT" \
            --target-path . --base-scan-id "$BASELINE_SCAN_ID" --ignore-commit-files --strict-blocking \
            --json-file "$out/report.json" --reach --reach-disable-analytics --reach-debug > "$out/cli.log" 2>&1 || rc=$?
          echo "RESULT|$SCENARIO|exit=$rc"
          echo "--- marker"
          cat /tmp/socket-probe-marker 2>/dev/null || echo none
          echo "--- files left in the project"
          find . -maxdepth 2 -not -path './.git*' | sort | head -40; ls target 2>/dev/null | head
          cp .socket.facts.json "$out/facts.json" 2>/dev/null || true
          echo "--- log lines about installing"
          sed -E 's/\x1b\[[0-9;]*m//g' "$out/cli.log" | grep -iE "Running command|finished with error|Pre-installing|Skipping|failed|error:|Reach|Unreach|ecosystem" | grep -vE "ulimit|which " | cut -c1-330 | head -150 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reach-cgo-${{ matrix.scenario }}
          path: ${{ runner.temp }}/socket/
          retention-days: 3
