name: Socket policy and VEX PR

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socket-vex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Server Block and Warn (optional)
    uses: ./.github/workflows/socket-scan.yaml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source_branch: ${{ github.head_ref || github.ref_name }}
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
  vex:
    name: Central VEX Block and Warn (optional)
    uses: ./.github/workflows/socket-scan.yaml
    with:
      mode: vex
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source_branch: ${{ github.head_ref || github.ref_name }}
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
