name: Socket VEX PR

'on':
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socket-vex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vex:
    name: Socket VEX findings (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOCKET_ORG: ${{ vars.SOCKET_ORG || 'lido-labs' }}
      SOCKET_REPO: ${{ vars.SOCKET_REPO || github.event.repository.name }}
      SCAN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SCAN_BRANCH: ${{ github.head_ref || github.ref_name }}
      SOCKET_FAIL_ON_FINDINGS: 'true'
    steps:
      - name: Set report directory
        run: echo "SOCKET_RESULTS_DIR=$RUNNER_TEMP/socket-vex-report" >> "$GITHUB_ENV"
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install hash-pinned Socket CLI
        run: bash .github/scripts/install-socket-cli.sh
      - name: Create Socket inventory scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: bash .github/scripts/socket-create-scan.sh
      - name: Collect server findings without a premature policy verdict
        if: ${{ always() }}
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          SOCKET_EVALUATION_MODE: collect
        run: python3 .github/scripts/socket-summary.py
      - name: Apply central VEX and emit final optional failed status
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/socket-vex-pipeline.py
      - name: Upload report even when findings fail the check
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: socket-vex-report
          path: |
            ${{ env.SOCKET_RESULTS_DIR }}/*.json
            ${{ env.SOCKET_RESULTS_DIR }}/*.md
          retention-days: 7

  priority-tests:
    name: Central VEX priority fixture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set evidence directory
        run: echo "SOCKET_RESULTS_DIR=$RUNNER_TEMP/central-priority-tests" >> "$GITHUB_ENV"
      - name: Test own Docker Aqua priority from central fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/test-central-vex.py
      - name: Upload priority test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: central-vex-priority-tests
          path: ${{ runner.temp }}/central-priority-tests/*.json
          retention-days: 7
